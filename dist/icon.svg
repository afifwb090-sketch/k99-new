<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="coffee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="steam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#292524" stroke-width="8" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="12 12" opacity="0.3" />
  
  <!-- Steam lines -->
  <path d="M 210 170 Q 200 130 220 100 Q 235 70 215 40" fill="none" stroke="url(#steam)" stroke-width="12" stroke-linecap="round" />
  <path d="M 256 160 Q 275 120 250 90 Q 230 60 256 30" fill="none" stroke="url(#steam)" stroke-width="14" stroke-linecap="round" />
  <path d="M 302 170 Q 320 130 300 100 Q 285 70 305 40" fill="none" stroke="url(#steam)" stroke-width="12" stroke-linecap="round" />

  <!-- Coffee Cup Body -->
  <path d="M 140 180 L 372 180 L 348 340 C 344 380 308 400 256 400 C 204 400 168 380 164 340 Z" fill="url(#coffee)" />
  
  <!-- Cup Handle -->
  <path d="M 360 210 Q 430 210 430 270 Q 430 330 348 330" fill="none" stroke="url(#coffee)" stroke-width="26" stroke-linecap="round" />

  <!-- Cup Rim -->
  <ellipse cx="256" cy="180" rx="116" ry="24" fill="#fbbf24" />
  <ellipse cx="256" cy="180" rx="104" ry="18" fill="#78350f" />

  <!-- Brand Text or Badge -->
  <rect x="180" y="260" width="152" height="42" rx="10" fill="#0c0a09" opacity="0.8" />
  <text x="256" y="289" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#fef3c7" text-anchor="middle" letter-spacing="3">K99 POS</text>

  <!-- Saucer / Base -->
  <path d="M 120 420 L 392 420 C 405 420 412 430 400 438 C 360 456 152 456 112 438 C 100 430 107 420 120 420 Z" fill="#78350f" />
  <path d="M 140 422 L 372 422" stroke="#d97706" stroke-width="6" stroke-linecap="round" />
</svg>
